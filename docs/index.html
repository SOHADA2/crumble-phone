<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크럼블 폰봇 받기</title>
<meta name="theme-color" content="#150F11">
<meta name="description" content="쿠키런: 크럼블 을 대신 돌려 주는 안드로이드 앱.">
<meta property="og:title" content="크럼블 폰봇">
<meta property="og:description" content="쿠키런: 크럼블, 알아서 돌려 드려요">
<meta property="og:type" content="website">
<style>
/* 색은 앱(Theme.kt)에서 그대로 가져왔다. 페이지와 앱이 같은 물건으로 보여야 한다. */
:root{
  --bg:#150F11; --cell:#2A2328; --fill:#211B1F; --sep:#3A3238;
  --label:#E8D9C8; --label2:#BCA491; --label3:#8A7565;
  --gold:#F8E861; --orange:#FD9500; --orange-deep:#F0921E; --red:#E8503C;
  --brown:#C2703A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--label); overflow-x:hidden; position:relative;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
  padding:0 22px calc(40px + env(safe-area-inset-bottom));
  word-break:keep-all;
}
main{max-width:420px;margin:0 auto;position:relative;z-index:1}

/* ── 바탕 ── 아이콘 뒤에서 천천히 숨 쉬는 따뜻한 빛. 어두운 화면이 죽어 보이지 않게 한다. */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 460px at 50% -6%, rgba(253,149,0,.20), transparent 62%),
    radial-gradient(520px 400px at 92% 22%, rgba(194,112,58,.14), transparent 68%);
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

/* 부스러기가 위로 떠오른다. 쿠키 앱이라는 걸 글자 없이 알린다. */
.crumbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.crumbs i{position:absolute;bottom:-24px;border-radius:50%;background:var(--brown);opacity:0;
  animation:rise-up linear infinite}
@keyframes rise-up{
  0%{opacity:0;transform:translateY(0) scale(.8)}
  12%{opacity:.5}
  85%{opacity:.28}
  100%{opacity:0;transform:translateY(-104vh) scale(1.15)}}

/* ── 머리 ── */
header{text-align:center;padding:64px 0 0}
.badge{position:relative;width:112px;height:112px;margin:0 auto 22px;animation:bob 4.6s ease-in-out infinite}
.badge::before{content:'';position:absolute;inset:-26px;border-radius:50%;
  background:radial-gradient(circle,rgba(253,149,0,.34),transparent 66%);
  animation:halo 4.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.badge svg{position:relative;width:112px;height:112px;border-radius:30px;display:block;
  box-shadow:0 18px 40px rgba(0,0,0,.55)}

h1{font-size:36px;line-height:1.2;letter-spacing:-.6px;font-weight:800;
   background:linear-gradient(180deg,#FFF6C9,var(--gold));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:10px;color:var(--label2);font-size:16px}
.chip{display:inline-block;margin-top:18px;padding:7px 15px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--sep);color:var(--label3);
  font-size:13px;letter-spacing:.3px;opacity:0;transition:opacity .5s}
.chip.on{opacity:1}

/* ── 받기 ── 화면에서 제일 큰 것 하나. 고민할 여지를 없앤다. */
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
  margin:30px 0 0;padding:22px 18px;border-radius:22px;text-decoration:none;
  background:linear-gradient(#FFCB6E,var(--orange-deep));
  border-bottom:6px solid #8A4A08;
  color:#3B1D02;font-size:22px;font-weight:800;
  box-shadow:0 14px 34px rgba(240,146,30,.34);
  animation:beat 3.6s ease-in-out infinite}
@keyframes beat{0%,88%,100%{transform:scale(1)}93%{transform:scale(1.025)}}
.cta::after{content:'';position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:translateX(-260%);animation:shine 4.2s ease-in-out 1s infinite}
@keyframes shine{0%{transform:translateX(-260%)}42%,100%{transform:translateX(360%)}}
.cta:active{transform:translateY(3px);border-bottom-width:3px;animation:none}
.cta svg{width:22px;height:22px;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.tiny{margin-top:12px;text-align:center;color:var(--label3);font-size:13px}

/* ── 세 걸음 ── 글 대신 번호와 두세 낱말. */
.steps{display:flex;gap:8px;margin-top:40px;list-style:none}
.steps li{flex:1;text-align:center;padding:16px 6px 15px;border-radius:16px;
  background:var(--fill);border:1px solid rgba(255,255,255,.045)}
.steps b{display:flex;width:26px;height:26px;margin:0 auto 9px;border-radius:50%;
  background:rgba(248,232,97,.12);color:var(--gold);font-size:13px;font-weight:700;
  align-items:center;justify-content:center}
.steps span{font-size:13.5px;color:var(--label);line-height:1.45;display:block}

/* ── 권한 ── 아이콘 + 낱말. 문단은 없앤다. */
.perms{display:flex;gap:8px;margin-top:12px}
.perms div{flex:1;text-align:center;padding:16px 6px 14px;border-radius:16px;
  background:var(--fill);border:1px solid rgba(255,255,255,.045)}
.perms svg{width:24px;height:24px;stroke:var(--orange);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.perms p{font-size:13.5px;color:var(--label)}
.perms em{display:block;font-style:normal;font-size:12px;color:var(--label3);margin-top:2px}
.safe{margin-top:12px;text-align:center;color:var(--label3);font-size:12.5px}
.safe b{color:var(--label2);font-weight:600}

/* ── 꼬리 ── 이미 쓰는 사람 몫. 처음 온 사람 눈을 뺏지 않게 작게. */
.after{margin-top:34px;padding-top:20px;border-top:1px solid var(--sep);
  text-align:center;color:var(--label3);font-size:13px;line-height:1.85}
.after b{color:var(--label2)}
.after .warn::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--red);margin-right:7px;vertical-align:middle}
.after a{color:var(--label3)}

#desk{display:none;margin-top:20px;padding:15px 18px;border-radius:16px;background:var(--fill);
  text-align:center;font-size:14px;color:var(--label2)}
#desk span{display:block;margin-top:6px;color:var(--gold);font-size:15px;word-break:break-all}

/* 들어올 때 하나씩 올라온다. */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.r{animation:rise .72s cubic-bezier(.2,.75,.3,1) both}
.r2{animation-delay:.10s}.r3{animation-delay:.20s}.r4{animation-delay:.30s}.r5{animation-delay:.40s}

/* 움직임을 줄여 달라고 한 기기에서는 전부 멈춘다. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chip{opacity:1}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="crumbs" aria-hidden="true"></div>

<main>
  <header>
    <!-- 앱 아이콘 그대로(ic_launcher_*.xml). 받은 뒤 홈 화면에서 같은 그림을 찾게 된다. -->
    <div class="badge r">
      <svg viewBox="0 0 108 108" role="img" aria-label="크럼블 폰봇">
        <rect width="108" height="108" rx="30" fill="#C2703A"/>
        <circle cx="54" cy="54" r="27" fill="#FFF3DC"/>
        <circle cx="45" cy="45" r="4.6" fill="#8A5323"/>
        <circle cx="65" cy="51" r="4.0" fill="#8A5323"/>
        <circle cx="50" cy="66" r="5.0" fill="#8A5323"/>
        <circle cx="66" cy="67" r="3.4" fill="#8A5323"/>
      </svg>
    </div>
    <h1 class="r r2">크럼블 폰봇</h1>
    <p class="sub r r2">쿠키런: 크럼블, 알아서 돌려 드려요</p>
    <span class="chip r r3" id="chip">안드로이드</span>
  </header>

  <a class="cta r r3" id="get" href="https://github.com/SOHADA2/crumble-phone/releases/download/latest/crumble-phone.apk">
    앱 받기
    <svg viewBox="0 0 24 24" fill="none" stroke="#3B1D02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v12M6 12l6 6 6-6"/></svg>
  </a>
  <p class="tiny r r3" id="tiny">안드로이드용이에요</p>

  <div id="desk">
    앱은 폰에 까는 거예요. 폰에서 열어 주세요.
    <span>sohada2.github.io/crumble-phone</span>
  </div>

  <ol class="steps r r4">
    <li><b>1</b><span>받기</span></li>
    <li><b>2</b><span>설치 허용</span></li>
    <li><b>3</b><span>안내 따라가기</span></li>
  </ol>

  <div class="perms r r4">
    <div>
      <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 11V9.5a1.5 1.5 0 0 1 3 0V12"/><path d="M15 12v-1a1.5 1.5 0 0 1 3 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6v-3a1.5 1.5 0 0 1 3 0"/></svg>
      <p>접근성<em>대신 눌러 줘요</em></p>
    </div>
    <div>
      <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <p>화면 읽기<em>보고 판단해요</em></p>
    </div>
    <div>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="8" height="7" rx="2" fill="#FD9500" stroke="none"/></svg>
      <p>위에 표시<em>조작 버튼</em></p>
    </div>
  </div>
  <p class="safe r r5">화면을 <b>녹화하지도, 어디로 보내지도 않아요.</b></p>

  <div class="after r r5">
    <div>이미 쓰고 있다면 앱 안 <b>[업데이트]</b></div>
    <div class="warn"><b>1.110 이하</b>는 지우고 새로 설치 (한 번만)</div>
    <div style="margin-top:10px"><a href="https://github.com/SOHADA2/crumble-phone">소스 보기</a></div>
  </div>
</main>

<script>
// 부스러기 — 크기·위치·속도를 흩어 놓는다. 규칙적으로 떠오르면 장식이 아니라 로딩처럼 보인다.
(function () {
  var box = document.querySelector('.crumbs');
  for (var i = 0; i < 9; i++) {
    var c = document.createElement('i'), s = 3 + Math.random() * 5;
    c.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + (Math.random() * 100) + '%;' +
      'animation-duration:' + (13 + Math.random() * 12) + 's;animation-delay:' + (-Math.random() * 20) + 's';
    box.appendChild(c);
  }
})();

// 버전·크기를 릴리스에서 읽어 채운다.
// 못 읽어도(오프라인·API 제한) 기본 글자가 그대로 남고 받기 단추는 된다.
(function () {
  fetch('https://api.github.com/repos/SOHADA2/crumble-phone/releases/tags/latest')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) return;
      var apk = (d.assets || []).filter(function (a) { return /\.apk$/.test(a.name); })[0];
      if (!apk) return;
      var ver = (String(d.name || '').match(/\d+\.\d+/) || [''])[0];
      var chip = document.getElementById('chip');
      chip.textContent = (ver ? 'v' + ver + ' · ' : '') + (apk.size / 1048576).toFixed(1) + 'MB';
      chip.classList.add('on');
      document.getElementById('get').href = apk.browser_download_url;
      var w = new Date(apk.updated_at);
      document.getElementById('tiny').textContent =
        '안드로이드용 · ' + (w.getMonth() + 1) + '월 ' + w.getDate() + '일에 올린 판';
    })
    .catch(function () {});
  document.getElementById('chip').classList.add('on');

  if (!/Android/i.test(navigator.userAgent)) document.getElementById('desk').style.display = 'block';
})();
</script>
</body>
</html>
