# main 에 밀어 넣으면 GitHub 이 APK 를 대신 빌드해 준다.
#   → 개발 PC 가 없어도(다른 컴퓨터·클라우드에서 작업해도) 폰에 넣을 APK 가 나온다.
#   결과는 ① Actions 아티팩트 ② 'latest' 릴리스에 붙은 app-debug.apk + latest.json 두 곳에 올라간다.
#   저장소가 공개라 앱이 인증 없이 릴리스에서 바로 받아 간다(앱 안 [업데이트]).
name: APK 빌드

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: 빌드
        env:
          # 앱의 versionCode 가 된다. 실행 번호라 계속 커진다 → 앱이 새 판인지 비교할 수 있다.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 버전 정보 만들기
        id: v
        run: |
          echo "tag=build-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "name=1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          # 앱이 읽는 아주 작은 안내문. 버전만 보고 새 판인지 판단한다.
          NOTES=$(git log -1 --pretty=%s)
          jq -n --argjson c ${{ github.run_number }} \
                --arg n "1.${{ github.run_number }}" \
                --arg s "${{ github.sha }}" \
                --arg t "$NOTES" \
                '{versionCode:$c, versionName:$n, commit:$s, notes:$t}' > latest.json
          cat latest.json

      - name: 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: crumble-phone-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: latest 릴리스에 붙이기 (앱이 여기서 받아 간다)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 APK ${{ steps.v.outputs.name }}
          body: |
            크럼블 폰봇 ${{ steps.v.outputs.name }} · ${{ steps.v.outputs.tag }}
            커밋: ${{ github.sha }}

            앱 안 [업데이트] 를 누르면 여기서 받아 갑니다.
            처음 설치할 때만 아래 app-debug.apk 를 직접 받으세요.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            latest.json
          prerelease: true
