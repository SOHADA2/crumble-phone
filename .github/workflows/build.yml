# main 에 밀어 넣으면 GitHub 이 APK 를 대신 빌드해 준다.
#   → 개발 PC 가 없어도(다른 컴퓨터·클라우드에서 작업해도) 폰에 넣을 APK 가 나온다.
#   결과는 ① Actions 아티팩트 ② 'latest' 릴리스에 붙은 app-debug.apk + latest.json 두 곳에 올라간다.
#   저장소가 공개라 앱이 인증 없이 릴리스에서 바로 받아 간다(앱 안 [업데이트]).
name: APK 빌드

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: 서명 키 풀기
        # 키는 저장소에 없다. Secrets 에서 받아 러너 안에만 잠깐 파일로 만든다.
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          # ⚠️ 값에 CR/개행/공백이 섞이면 `base64 -d` 가 'invalid input' 으로 죽는다(한 번 겪었다).
          #    시크릿을 어떤 셸에서 넣었든 안전하도록 여기서 걷어내고 푼다.
          printf '%s' "$KS_B64" | tr -d '
 ' | base64 -d > "$RUNNER_TEMP/release.jks"
          # 제대로 풀렸는지 확인 — 조용히 빈 파일이 만들어지면 뒤에서 엉뚱한 오류가 난다.
          SZ=$(stat -c%s "$RUNNER_TEMP/release.jks")
          echo "keystore 크기: ${SZ} 바이트"
          if [ "$SZ" -lt 1000 ]; then echo "::error::서명 키가 제대로 안 풀렸어요(SIGNING_KEYSTORE_B64 확인)"; exit 1; fi

      - name: 빌드
        env:
          # 앱의 versionCode 가 된다. 실행 번호라 계속 커진다 → 앱이 새 판인지 비교할 수 있다.
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          # 배포 파일명은 고정한다 — 앱의 Updater 가 이 이름으로 받아 간다.
          cp app/build/outputs/apk/release/app-release.apk crumble-phone.apk
          ls -l crumble-phone.apk

      - name: 버전 정보 만들기
        id: v
        run: |
          echo "tag=build-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "name=1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          # 앱이 읽는 아주 작은 안내문. 버전만 보고 새 판인지 판단한다.
          NOTES=$(git log -1 --pretty=%s)
          jq -n --argjson c ${{ github.run_number }} \
                --arg n "1.${{ github.run_number }}" \
                --arg s "${{ github.sha }}" \
                --arg t "$NOTES" \
                '{versionCode:$c, versionName:$n, commit:$s, notes:$t}' > latest.json
          cat latest.json

      - name: 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: crumble-phone-apk
          path: crumble-phone.apk

      - name: latest 릴리스에 붙이기 (앱이 여기서 받아 간다)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 APK ${{ steps.v.outputs.name }}
          body: |
            크럼블 폰봇 ${{ steps.v.outputs.name }} · ${{ steps.v.outputs.tag }}
            커밋: ${{ github.sha }}

            ## 설치 방법
            1. 폰 브라우저로 이 페이지를 열고 아래 **crumble-phone.apk** 를 받으세요.
            2. "이 출처의 앱 설치" 를 허용해야 설치됩니다(안드로이드가 한 번 물어봅니다).
            3. 앱을 열고 **처음 안내**를 따라가면 됩니다.

            ### 권한이 왜 필요한가요
            - **접근성** — 봇이 화면을 대신 눌러 줍니다(이게 없으면 아무것도 못 합니다).
            - **화면 읽기** — 게임 화면을 보고 판단합니다. 녹화하거나 어디로 보내지 않습니다.
            - **다른 앱 위에 표시** — 게임 위에 작은 조작 버튼을 띄웁니다.

            다음부터는 앱 안 **[업데이트]** 를 누르면 여기서 알아서 받아 갑니다.

            > ⚠️ **1.110 이하를 쓰던 분은 기존 앱을 지우고 새로 설치해 주세요.**
            > 서명 키가 바뀌어서 덮어쓰기 설치가 안 됩니다(이번 한 번만).
          files: |
            crumble-phone.apk
            latest.json
          prerelease: true
